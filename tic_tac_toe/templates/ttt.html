<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2>Tic Tac Toe AI</h2>
<div id="board"></div>
<p id="info"></p>

<script>
let board = ["","","","","","","","",""];

function render(){
    let html="";
    board.forEach((v,i)=>{
        html += `<button onclick="play(${i})">${v}</button>`;
        if((i+1)%3==0) html+="<br>";
    });
    document.getElementById("board").innerHTML = html;
}

function play(i){
    if(board[i]!="") return;

    board[i]="X";

    fetch("/move",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({board})
    })
    .then(r=>r.json())
    .then(d=>{
        board[d.move]="O";
        document.getElementById("info").innerText =
        `Time: ${d.time.toFixed(5)} | Nodes: ${d.nodes}`;
        render();
    });
}

render();
</script>

</body>
</html>
